<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' file:">
<title>Melee Coach</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="titlebar">
  <svg width="18" height="18" viewBox="0 0 26 26" fill="none" stroke="#21d0bf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l4.5 4L13 6l4.5 7L22 9l-2 9H6z"/><path d="M7 21h12"/></svg>
  <b>Melee Coach</b><span class="ver">v0.12.0</span>
  <div class="gswitch" role="group" aria-label="Game"><button data-game="melee" aria-pressed="true">Melee</button><button data-game="rivals" aria-pressed="false">Rivals 2</button></div>
</div>
<div class="shell">
  <nav class="rail" aria-label="Main">
    <button data-view="home" class="on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-view="games"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Games</button>
    <button data-view="review"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>Review</button>
    <button data-view="highlights"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Highlights</button>
    <button data-view="matchups"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="9" r="3.2"/><circle cx="16.5" cy="9" r="3.2"/><path d="M2.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6M11 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/></svg>Matchups</button>
    <button data-view="progress"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Progress</button>
    <div class="spacer"></div>
    <button data-view="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
  </nav>
  <div class="content" id="content"></div>
</div>
<div class="toast" id="updToast" role="alertdialog" aria-labelledby="updTitle" aria-describedby="updBody" hidden>
  <div class="toast-ic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></div>
  <div class="toast-main">
    <b id="updTitle">Installing update…</b>
    <div id="updBody" class="sub"></div>
    <ul id="updNotes"></ul>
    <div class="toast-act"><button class="btn primary" id="updRestart">Restart now</button><button class="btn" id="updLater">Later</button></div>
  </div>
  <button class="toast-x" id="updClose" aria-label="Close">×</button>
</div>
<footer class="statusbar" role="status" aria-live="polite">
  <span class="sb-conn" id="sbConn"><span class="dot"></span><span id="sbConnText">Waiting for game</span></span>
  <span class="sb-import" id="sbImport" hidden>
    <span id="sbImportText">Importing replays</span>
    <span class="sb-track"><span class="sb-fill" id="sbFill"></span></span>
    <span id="sbCount" class="sb-count"></span>
  </span>
  <span class="sb-games" id="sbGames"></span>
</footer>
<script src="matchups.js"></script>
<script src="rivals.js"></script>
<script src="app.js"></script>
</body>
</html>
